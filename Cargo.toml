[workspace]
members = [
  "crates/juzu-core",
  "crates/juzu-jj",
  "crates/juzu-tui",
  "crates/juzu-server",
  "crates/juzu-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = ""

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
futures-executor = "0.3"
serde_json = "1.0"
thiserror = "2.0"

juzu-core = { path = "crates/juzu-core" }
juzu-jj = { path = "crates/juzu-jj" }
