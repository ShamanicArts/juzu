[workspace]
members = [
  "crates/juzu-core",
  "crates/juzu-jj",
  "crates/juzu-tui",
  "crates/juzu-cli",
  "crates/juzu-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ShamanicArts/juzu"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
futures-executor = "0.3"
ratatui = "0.29"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

juzu-core = { path = "crates/juzu-core" }
juzu-jj = { path = "crates/juzu-jj" }
