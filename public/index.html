<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ Viz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <span class="logo-icon">◉</span>
                <h1>JJ<span class="highlight">Visualizer</span></h1>
            </div>
            <div class="controls">
                <button id="refreshBtn">Refresh Graph</button>
            </div>
        </header>
        
        <main>
            <div class="canvas-wrapper" id="canvasContainer">
                <canvas id="graphCanvas"></canvas>
                <div id="nodeTooltip" class="node-tooltip" style="display: none;">
                    <div class="tooltip-header">
                        <span id="tooltipId" class="tooltip-id"></span>
                        <div class="tooltip-actions">
                            <button id="btnDescribe" title="Describe">✏️</button>
                            <button id="btnNew" title="New Commit">🌱</button>
                            <button id="btnRebase" title="Rebase">⚓</button>
                        </div>
                    </div>
                    <div id="tooltipFiles" class="tooltip-files"></div>
                </div>
            </div>
            <aside class="details-panel" id="detailsPanel">
                <div class="empty-state">Select a commit to view details</div>
            </aside>
        </main>
    </div>
    <script src="client.js"></script>
</body>
</html>
