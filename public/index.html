<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jj-viz - Jujutsu VCS Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111318;
      --panel: #1a2029;
      --panel2: rgba(26, 32, 41, 0.94);
      --surface: #161b22;
      --surface-2: #1d2530;
      --text: #d8dee8;
      --muted: #8a95a7;
      --border: #2a3442;
      --border2: #3a4759;
      --sep-subtle: rgba(138, 149, 167, 0.24);
      --sep-strong: rgba(138, 149, 167, 0.42);
      --success: #74b88c;
      --warn: #c9a86a;
      --error: #ce6f7c;
      --info: #7f9fbf;
      --file-add: #22c55e;
      --file-mod: #f59e0b;
      --file-del: #ef4444;
      --slate: #9aa7b9;
      --slate-soft: rgba(138, 149, 167, 0.18);
      --slate-strong: rgba(138, 149, 167, 0.5);
      --graph-dot-major: rgba(127, 159, 191, 0.12);
      --graph-dot-minor: rgba(216, 222, 232, 0.05);
      /* Legacy aliases used across existing classes/components. */
      --cyan: var(--info);
      --green: var(--success);
      --orange: var(--warn);
      --red: var(--error);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
    }

    .jjv-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      /* Solid base (no gradients behind the dot-board) */
      background: var(--bg);
    }

    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    .jjv-header {
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(22, 27, 34, 0.98), rgba(22, 27, 34, 0.92));
      border-bottom: 1px solid var(--sep-strong);
      backdrop-filter: blur(8px);
    }

    .jjv-headerMain {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      padding-right: 12px;
    }

    .jjv-headerRail {
      width: 340px;
      min-width: 340px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-left: 1px solid var(--sep-subtle);
      padding-left: 12px;
    }

    .jjv-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .jjv-chip {
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--sep-subtle);
      background: rgba(17, 19, 24, 0.45);
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: lowercase;
    }

    .jjv-title {
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .jjv-sub {
      color: var(--muted);
      font-size: 12px;
    }

    .jjv-modeBadge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #111318;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .jjv-rebaseSource {
      font-size: 11px;
      color: var(--warn);
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border: 1px solid var(--sep-subtle);
      border-radius: 4px;
      background: rgba(201, 168, 106, 0.1);
    }

    .jjv-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 26vw;
    }

    .jjv-meta--error { color: var(--red); }

    .jjv-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .jjv-viewTabs {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .jjv-footer {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-top: 1px solid var(--sep-strong);
      background: rgba(17, 19, 24, 0.95);
      font-size: 11px;
      color: var(--muted);
      min-width: 0;
    }

    .jjv-footerLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .jjv-footerCenter {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
      min-width: 0;
      padding: 0 16px;
    }

    .jjv-footerRight {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .jjv-footerSegment {
      padding: 1px 8px;
      background: rgba(29, 37, 48, 0.7);
      border: 1px solid var(--sep-subtle);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    .jjv-footerPath {
      max-width: 40vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jjv-footerBookmark {
      color: var(--info);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .jjv-footerWc {
      color: var(--success);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .jjv-footerMeta {
      color: var(--muted);
      text-transform: lowercase;
      font-size: 10px;
      padding: 1px 6px;
      border: 1px solid var(--sep-subtle);
      border-radius: 4px;
    }

    .jjv-footerPill {
      border: 1px solid var(--sep-subtle);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .jjv-footerHints {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .jjv-footerHints--advanced {
      opacity: 0.75;
    }

    .jjv-footerStatus {
      padding: 1px 8px;
      background: rgba(29, 37, 48, 0.7);
      border: 1px solid var(--sep-subtle);
      border-radius: 4px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 32vw;
      font-family: 'JetBrains Mono', monospace;
    }

    .jjv-footerStatus--error {
      color: var(--error);
      border-color: rgba(206, 111, 124, 0.5);
      background: rgba(206, 111, 124, 0.1);
    }

    .jjv-btn {
      appearance: none;
      border: 1px solid var(--sep-subtle);
      background: rgba(29, 37, 48, 0.7);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .jjv-btn:hover {
      border-color: var(--slate-strong);
      background: rgba(29, 37, 48, 0.95);
    }
    .jjv-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .jjv-btn--primary {
      border-color: var(--slate-strong);
      background: var(--slate-soft);
      color: #d7dde2;
    }

    .jjv-btn--ghost {
      background: rgba(17, 19, 24, 0.24);
      border-color: var(--sep-subtle);
    }

    .jjv-btn--danger {
      border-color: rgba(255, 0, 85, 0.72);
      background: rgba(255, 0, 85, 0.12);
      color: #ffd7e5;
    }

    .jjv-btn:focus-visible {
      outline: 1px solid var(--slate);
      outline-offset: 1px;
    }

    .jjv-select {
      border: 1px solid var(--sep-subtle);
      background: rgba(29, 37, 48, 0.7);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
    }

    .jjv-input {
      border: 1px solid var(--sep-subtle);
      background: rgba(29, 37, 48, 0.55);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      min-width: 140px;
    }

    .jjv-main {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .jjv-canvasPane {
      flex: 1;
      min-width: 0;
      position: relative;
      border-right: 1px solid var(--sep-strong);
      min-height: 0;
      overflow: hidden;
    }

    .jjv-sidebar {
      width: 340px;
      max-width: 340px;
      flex-shrink: 0;
      min-height: 0;
      background: var(--panel);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .jjv-canvasWrap {
      width: 100%;
      height: 100%;
      position: relative;
      background-image:
        radial-gradient(var(--graph-dot-major) 1px, transparent 1px),
        radial-gradient(var(--graph-dot-minor) 1px, transparent 1px);
      background-size: 22px 22px, 44px 44px;
      background-position: 0 0, 11px 11px;
    }

    .jjv-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    .jjv-inspector {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
    }

    .jjv-panelHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .jjv-panelTitle { color: var(--text); font-weight: 700; }
    .jjv-panelActions { display: flex; gap: 8px; }

    .jjv-card {
      border: 1px solid var(--sep-subtle);
      background: rgba(22, 27, 34, 0.6);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .jjv-section {
      border: 1px solid var(--sep-subtle);
      border-radius: 10px;
      background: rgba(17, 19, 24, 0.35);
      margin-bottom: 8px;
      overflow: hidden;
    }

    .jjv-sectionSummary {
      cursor: pointer;
      list-style: none;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 7px 10px;
      background: rgba(17, 19, 24, 0.55);
      border-bottom: 1px solid var(--sep-subtle);
      user-select: none;
    }

    .jjv-sectionSummary::-webkit-details-marker {
      display: none;
    }

    .jjv-section > .jjv-card {
      border: 0;
      border-radius: 0;
      margin-bottom: 0;
      box-shadow: none;
      background: transparent;
    }

    .jjv-cardTitle { color: var(--muted); font-size: 12px; margin-bottom: 10px; letter-spacing: 0.3px; }

    .jjv-row { display: flex; gap: 10px; align-items: center; }
    .jjv-row--wrap { flex-wrap: wrap; }
    .jjv-id { color: var(--cyan); font-weight: 700; word-break: break-all; }
    .jjv-muted { color: var(--muted); font-size: 12px; }
    .jjv-desc { margin-top: 10px; white-space: pre-wrap; }

    .jjv-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid var(--sep-subtle);
      background: rgba(17, 19, 24, 0.55);
      color: var(--text);
    }
    .jjv-badge--bookmark { border-color: rgba(0, 240, 255, 0.65); color: var(--cyan); }
    .jjv-badge--branch { border-color: rgba(255, 170, 0, 0.65); color: var(--orange); }
    .jjv-badge--conflict { border-color: rgba(255, 0, 85, 0.75); color: var(--red); }
    .jjv-badge--empty { border-color: rgba(136, 136, 136, 0.75); color: var(--muted); }
    .jjv-badge--wc { border-color: rgba(0, 255, 157, 0.7); color: var(--green); }

    .jjv-kv { margin-top: 10px; display: grid; gap: 6px; }
    .jjv-kvRow { display: grid; grid-template-columns: 80px 1fr; gap: 10px; }
    .jjv-k { color: var(--muted); font-size: 12px; }
    .jjv-v { color: var(--text); font-size: 12px; word-break: break-word; }

    .jjv-files { display: grid; gap: 6px; }
    .jjv-fileRow {
      display: grid;
      grid-template-columns: 18px 18px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--sep-subtle);
      background: rgba(22, 27, 34, 0.35);
    }
    .jjv-fileRow input { accent-color: var(--file-mod); }
    .jjv-fileType { font-weight: 700; font-size: 12px; }
    .jjv-fileType--A { color: var(--file-add); }
    .jjv-fileType--D { color: var(--file-del); }
    .jjv-fileType--M { color: var(--file-mod); }
    .jjv-filePath { font-size: 12px; word-break: break-all; }

    .jjv-textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--sep-subtle);
      background: rgba(22, 27, 34, 0.55);
      color: var(--text);
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      resize: vertical;
    }

    .jjv-diff {
      max-height: 360px;
      overflow: auto;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      border: 1px solid var(--sep-subtle);
      padding: 10px;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .jjv-diffSection {
      border: 1px solid var(--sep-subtle);
      border-radius: 10px;
      background: rgba(22, 27, 34, 0.35);
      padding: 0;
      overflow: hidden;
    }

    .jjv-diffSummary {
      cursor: pointer;
      list-style: none;
      padding: 8px 10px;
      font-size: 12px;
      color: #d7dde2;
      border-bottom: 1px solid var(--slate-strong);
      background: var(--slate-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .jjv-diffSummaryMeta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .jjv-diffSummary::-webkit-details-marker {
      display: none;
    }

    .jjv-diffLine { color: var(--text); }
    .jjv-diffLine--meta { color: var(--muted); }
    .jjv-diffLine--file { color: var(--orange); }
    .jjv-diffLine--hunk { color: var(--slate); }
    .jjv-diffLine--add {
      color: var(--green);
      background: rgba(0, 255, 157, 0.08);
    }
    .jjv-diffLine--del {
      color: var(--red);
      background: rgba(255, 0, 85, 0.08);
    }

    .jjv-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .jjv-tab {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--sep-subtle);
      background: rgba(22, 27, 34, 0.3);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .jjv-tab--active {
      color: var(--text);
      border-color: rgba(0, 240, 255, 0.65);
      background: rgba(0, 240, 255, 0.08);
    }

    .jjv-toast {
      position: sticky;
      bottom: 10px;
      margin: 10px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.5);
      background: rgba(0, 240, 255, 0.08);
      color: var(--text);
      font-size: 12px;
    }

    .jjv-modalBackdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 16px;
      padding-top: 62px;
      background: rgba(7, 8, 12, 0.2);
      z-index: 40;
      pointer-events: none;
    }

    .jjv-modal {
      width: min(380px, calc(100vw - 32px));
      border-radius: 12px;
      border: 1px solid var(--border2);
      background: rgba(20, 17, 15, 0.97);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      padding: 12px;
      display: grid;
      gap: 10px;
      pointer-events: auto;
    }

    .jjv-modalTitle {
      font-size: 14px;
      font-weight: 700;
      color: #e8eaee;
    }

    .jjv-modalBody {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .jjv-modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 1360px), (max-height: 720px) {
      .jjv-chip { display: none; }

      .jjv-header {
        min-height: 52px;
        padding: 8px 10px;
      }

      .jjv-headerMain {
        gap: 8px;
        padding-right: 8px;
      }

      .jjv-headerRail {
        width: 300px;
        min-width: 300px;
        padding-left: 8px;
      }

      .jjv-controls {
        justify-content: flex-start;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
      }

      .jjv-controls .jjv-row {
        flex-wrap: nowrap;
      }

      .jjv-controls .jjv-input {
        min-width: 170px;
        width: 220px;
      }

      .jjv-btn,
      .jjv-select,
      .jjv-input {
        font-size: 11px;
        padding: 6px 8px;
      }

      .jjv-footerHints--advanced { display: none; }
    }

    @media (max-width: 1600px) {
      .jjv-footerHints--advanced {
        display: none;
      }
    }

    @media (max-width: 800px) {
      .jjv-sidebar { display: none; }
      .jjv-meta { max-width: 38vw; }
      .jjv-chip { display: none; }
      .jjv-header {
        display: block;
        padding-bottom: 8px;
      }
      .jjv-headerMain {
        padding-right: 0;
        margin-bottom: 8px;
      }
      .jjv-headerRail {
        width: auto;
        min-width: 0;
        border-left: 0;
        padding: 0;
      }
      .jjv-viewTabs {
        flex-wrap: wrap;
      }
      .jjv-footerHints--advanced { display: none; }
    }

    /* Op Log View */
    .jjv-oplog {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }

    .jjv-oplog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .jjv-oplog-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .jjv-oplog-controls {
      display: flex;
      gap: 8px;
    }

    .jjv-oplog-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .jjv-oplog-item {
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .jjv-oplog-item:hover {
      border-color: var(--border2);
    }

    .jjv-oplog-item--selected {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .jjv-oplog-item__main {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .jjv-oplog-item__current {
      font-size: 14px;
      color: var(--muted);
    }

    .jjv-oplog-item__current--active {
      color: var(--green);
    }

    .jjv-oplog-item__id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--cyan);
    }

    .jjv-oplog-item__time {
      font-size: 12px;
      color: var(--muted);
    }

    .jjv-oplog-item__user {
      font-size: 12px;
      color: var(--muted);
    }

    .jjv-oplog-item__tags {
      display: flex;
      gap: 4px;
    }

    .jjv-oplog-item__tag {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(255, 170, 0, 0.2);
      color: var(--orange);
      border-radius: 4px;
    }

    .jjv-oplog-item__desc {
      font-size: 13px;
      color: var(--text);
      margin-left: 26px;
    }

    .jjv-oplog-detail {
      margin-top: 20px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .jjv-oplog-detail h4 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--cyan);
    }

    .jjv-oplog-detail div {
      font-size: 13px;
      margin-bottom: 8px;
    }

    /* Obslog View */
    .jjv-obslog {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }

    .jjv-obslog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .jjv-obslog-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .jjv-obslog-changeid {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--muted);
      margin-left: 8px;
    }

    .jjv-obslog-empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    .jjv-obslog-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .jjv-obslog-item {
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .jjv-obslog-item:hover {
      border-color: var(--border2);
    }

    .jjv-obslog-item--current {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .jjv-obslog-item__main {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .jjv-obslog-item__wc {
      font-size: 14px;
      color: var(--muted);
    }

    .jjv-obslog-item__wc--active {
      color: var(--green);
    }

    .jjv-obslog-item__commit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--cyan);
    }

    .jjv-obslog-item__time {
      font-size: 12px;
      color: var(--muted);
    }

    .jjv-obslog-item__conflict {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(255, 0, 85, 0.2);
      color: var(--red);
      border-radius: 4px;
    }

    .jjv-obslog-item__empty {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(138, 129, 122, 0.2);
      color: var(--muted);
      border-radius: 4px;
    }

    .jjv-obslog-item__bookmarks {
      font-size: 11px;
      color: var(--orange);
    }

    .jjv-obslog-item__author {
      font-size: 12px;
      color: var(--muted);
      margin-left: 26px;
    }

    .jjv-obslog-item__desc {
      font-size: 13px;
      color: var(--text);
      margin-left: 26px;
      margin-top: 4px;
    }

    .jjv-obslog-item__hidden {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(138, 129, 122, 0.15);
      color: var(--muted);
      border-radius: 4px;
      font-style: italic;
    }

    .jjv-oplog-item__args {
      font-size: 11px;
      color: var(--muted);
      margin-left: 26px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      border-left: 2px solid var(--orange);
      word-break: break-all;
    }

    .jjv-oplog-item__duration {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .jjv-obslog-item__op {
      font-size: 11px;
      color: var(--muted);
      margin-left: 26px;
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      border-left: 2px solid var(--cyan);
    }

    .jjv-obslog-item__op-id {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
    }

    .jjv-obslog-item__op-desc {
      margin-left: 8px;
    }

    .jjv-obslog-item__op-args {
      display: block;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--orange);
      word-break: break-all;
    }

    .jjv-oplog-list, .jjv-obslog-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
