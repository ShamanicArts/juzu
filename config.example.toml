# Main Configuration File
# This file controls application behavior. For visual/theming settings,
# see themes/config.toml (or ~/.config/juzu/themes/config.toml)

[theme]
# Select which theme to use. Theme files are loaded from:
# 1) <repo>/.juzu/themes/<name>.toml
# 2) ~/.config/juzu/themes/<name>.toml
# 3) bundled ./themes/<name>.toml
name = "slate"

[layout]
# Startup layout mode: chronological | mainline | bookmark-centric | wc-focused | topological
startupMode = "chronological"

[web]
pollIntervalMs = 3000
navigationLockDefault = false

[tui]
sidebarBreakpointWidth = 90
sidebarMinHeight = 16
stackedSidebarRatio = 0.5
prefetchDiffInLog = false
clearDiffCacheWhenNotInDiff = true

[tui.keymap]
# Leader modes are persistent by default (no timeout).
stickyModes = true
showIdleBindingsInStatus = false
showLeaderTriggersInStatus = true
modeOrder = ["action", "ops", "view", "marks"]
statusContextOrder = ["oplog", "obslog", "diff", "merge", "rebase", "describe", "revset", "themePicker"]
exitKeys = ["escape", "q"]

# Hint display control
# hideHintsForModes: Don't show hints for these specific leader modes (blacklist)
# hideHintsInIdle: Don't show hints in idle/base log view
# showMinimalHints: Show badges only (ACT OPS VIEW MARK) instead of ^a ACT ^o OPS
hideHintsForModes = []
hideHintsInIdle = false
showMinimalHints = false

[tui.keymap.leaders]
action = "ctrl+a"
ops = "ctrl+o"
view = "ctrl+v"
marks = "ctrl+b"

[tui.keymap.labels]
action = "Actions"
ops = "Operations"
view = "View"
marks = "Bookmarks"

[tui.keymap.badges]
action = "Act"
ops = "Ops"
view = "View"
marks = "Book"

[tui.keymap.idleBindings]
# Add optional single-key shortcuts in idle mode if desired.
# n = "new"
h = "toggle-help"
"ctrl+d" = "diff-toggle"

[tui.keymap.modeBindings.action]
n = "new"
e = "edit"
d = "describe"
b = "rebase"
i = "insert"
a = "abandon"
s = "squash"
y = "duplicate"
z = "restore"
m = "merge-mode"

[tui.keymap.modeBindings.ops]
u = "undo"
r = "redo"
f = "git-fetch"
p = "git-push"
o = "oplog"
v = "obslog"
g = "back-log"

[tui.keymap.modeBindings.view]
"1" = "layout-chronological"
"2" = "layout-mainline"
"3" = "layout-bookmark-centric"
"4" = "layout-wc-focused"
"5" = "layout-topological"
c = "toggle-sidebar"
t = "theme-picker"
r = "refresh"
f = "toggle-files"
x = "toggle-description"
h = "toggle-help"
"/" = "revset"
"ctrl+d" = "diff-toggle"

[tui.keymap.modeBindings.marks]
s = "bookmark-set"
d = "bookmark-delete"

[tui.keymap.statusContextLabels]
oplog = "OPLOG"
obslog = "OBSLOG"
diff = "DIFF"
merge = "MERGE"
rebase = "REBASE"
describe = "DESCRIBE"
revset = "REVSET"
themePicker = "THEME"

# Optional: override built-in action names shown in status chips.
# [tui.keymap.commandLabels]
# "bookmark-set" = "Bookmark +"
# "bookmark-delete" = "Bookmark -"

# Optional: override context-specific status chips (array of tables).
# [[tui.keymap.statusContexts.oplog]]
# key = "r"
# label = "Restore"
# tone = "ops"
#
# [[tui.keymap.statusContexts.oplog]]
# key = "g"
# label = "Log"
# tone = "ops"

# Optional: Override specific UI tokens from the theme.
# These override both the base theme and the theme file.
# [uiTokens.semantic]
# info = "#7f9fbf"
# modeAction = "#c9a86a"
# modeOps = "#7f9fbf"
# modeView = "#6f89ad"
# modeMarks = "#74b88c"
#
# [uiTokens.diff]
# addedBg = "#1f3a2a"
# removedBg = "#47252b"
# addedContentBg = "#2a5b3d"
# removedContentBg = "#69333a"
# addedSignColor = "#50fa7b"
# removedSignColor = "#ff5555"
# contextBg = "#111318"
# contextContentBg = "#111318"
