[theme]
# Uses themes/<name>.toml from:
# 1) <repo>/.jj-viz/themes/
# 2) ~/.config/jj-viz/themes/
# 3) bundled ./themes/
name = "slate"

[web]
pollIntervalMs = 3000
navigationLockDefault = false

[tui]
sidebarBreakpointWidth = 90
sidebarMinHeight = 16
stackedSidebarRatio = 0.5

[graph]
nodeRadius = 5
laneWidth = 24
ySpacing = 84
canvasPadding = 50
textColumnGap = 60

# Optional token overrides (partial is fine)
# [uiTokens.semantic]
# info = "#7f9fbf"
#
# Optional diff overrides (sidebar + full diff view)
# [uiTokens.diff]
# addedBg = "#1f3a2a"
# removedBg = "#47252b"
# addedContentBg = "#2a5b3d"
# removedContentBg = "#69333a"
# addedSignColor = "#50fa7b"
# removedSignColor = "#ff5555"
# contextBg = "#111318"
# contextContentBg = "#111318"
