# Theme Configuration - Default visual settings for all themes
# This file provides base visual configuration that applies to all themes.
# Individual theme files can override these values.

[visual]
# Graph rendering settings
nodeRadius = 5
laneWidth = 24
ySpacing = 84
canvasPadding = 50
textColumnGap = 60

[uiTokens]
# Base UI tokens that serve as defaults for all themes.
# Individual themes and user config can override these.

[uiTokens.slate]
bg0 = "#111318"
bg1 = "#161b22"
bg2 = "#1d2530"
panel = "#1a2029"
panelElevated = "#222b37"
borderSoft = "#2a3442"
borderStrong = "#3a4759"
text = "#d8dee8"
textMuted = "#8a95a7"

[uiTokens.semantic]
success = "#74b88c"
warn = "#c9a86a"
error = "#ce6f7c"
info = "#7f9fbf"
fileAdd = "#22c55e"
fileMod = "#f59e0b"
fileDel = "#ef4444"
modeLog = "#6f89ad"

[uiTokens.graph]
node = "#444"
nodeSelected = "#ffffff"
nodeConflict = "#ff0055"
text = "#888"
textDesc = "#bbb"
textMuted = "#6a7685"
nodeBorder = "#666"
canvasTint = "rgba(17, 19, 24, 0.22)"
commitId = "#5a6a7a"
bookmark = "#c9a86a"
bookmarkSelected = "#e8c884"
fileAdd = "#74b88c"
fileMod = "#c9a86a"
fileDel = "#ce6f7c"
lanes = [
  "#00f0ff",
  "#ff0055",
  "#00ff9d",
  "#ffaa00",
  "#aa00ff",
  "#00aaff",
  "#ffff00",
  "#ff00aa",
]

[uiTokens.diff]
contextBg = "#111318"
contextContentBg = "#111318"
addedBg = "#1f3a2a"
removedBg = "#47252b"
addedContentBg = "#2a5b3d"
removedContentBg = "#69333a"
addedSignColor = "#22c55e"
removedSignColor = "#ef4444"

[uiTokens.spacing]
xs = 4
sm = 8
md = 12
lg = 16

[uiTokens.radius]
sm = 6
md = 10
lg = 12

[uiTokens.separator]
subtle = "rgba(138, 149, 167, 0.24)"
strong = "rgba(138, 149, 167, 0.42)"
