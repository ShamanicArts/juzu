<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Juzu</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell" id="app" aria-busy="true">
      <header class="topbar">
        <div class="identity">
          <strong class="wordmark">JUZU</strong>
          <span class="repo-name" id="repo-name">Opening workspace…</span>
        </div>

        <form class="revset-form" id="revset-form" role="search">
          <label class="sr-only" for="revset-input">Revset</label>
          <span class="search-glyph" aria-hidden="true">/</span>
          <input
            id="revset-input"
            name="revset"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Filter with a revset"
          >
        </form>

        <div class="topbar-controls">
          <label class="sr-only" for="layout-mode">Layout</label>
          <select id="layout-mode" title="Graph layout">
            <option value="mainline">Mainline</option>
            <option value="chronological">Chronological</option>
            <option value="bookmark-centric">Bookmarks</option>
            <option value="wc-focused">Working copy</option>
            <option value="topological">Topological</option>
          </select>

          <label class="sr-only" for="history-limit">History limit</label>
          <select id="history-limit" title="History limit">
            <option value="100">100 changes</option>
            <option value="250" selected>250 changes</option>
            <option value="500">500 changes</option>
            <option value="1000">1,000 changes</option>
          </select>

          <button class="icon-button" id="refresh-button" type="button" title="Refresh" aria-label="Refresh repository">
            <span aria-hidden="true">↻</span>
          </button>
          <span class="safety-chip">Read only</span>
        </div>
      </header>

      <main class="workspace">
        <section class="graph-surface" aria-label="Commit graph">
          <canvas id="graph-canvas" tabindex="0" aria-label="Interactive commit graph. Use J and K or arrow keys to change selection."></canvas>

          <div class="graph-loading" id="graph-loading" role="status">
            <span class="loading-line"></span>
            <span>Loading history</span>
          </div>

          <div class="graph-empty" id="graph-empty" hidden>
            <strong>No changes match this revset</strong>
            <button type="button" id="clear-revset">Clear filter</button>
          </div>

          <div class="viewport-controls" aria-label="Graph viewport controls">
            <button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
            <button class="icon-button" id="focus-selection" type="button" aria-label="Focus selected change" title="Focus selected change">◎</button>
            <button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          </div>

          <footer class="graph-status">
            <span><span class="live-dot" id="live-dot"></span><span id="connection-status">Connecting</span></span>
            <span id="graph-count"></span>
            <span id="zoom-level">100%</span>
          </footer>
        </section>

        <aside class="inspector" aria-label="Selected change details">
          <div class="inspector-empty" id="inspector-empty">
            <strong>Select a change</strong>
            <span>Click a graph row or use J and K.</span>
          </div>

          <div class="inspector-content" id="inspector-content" hidden>
            <header class="change-header">
              <div class="change-kicker">
                <button class="copy-id" id="copy-change-id" type="button" title="Copy change ID">
                  <span id="change-id"></span>
                  <span aria-hidden="true">⌘</span>
                </button>
                <div class="state-badges" id="state-badges"></div>
              </div>
              <h1 id="change-title"></h1>
              <p class="change-description" id="change-description"></p>
            </header>

            <dl class="metadata">
              <div><dt>Commit</dt><dd id="commit-id"></dd></div>
              <div><dt>Author</dt><dd id="change-author"></dd></div>
              <div><dt>Time</dt><dd id="change-time"></dd></div>
              <div id="bookmarks-row" hidden><dt>Bookmarks</dt><dd id="change-bookmarks"></dd></div>
            </dl>

            <div class="inspector-tabs" role="tablist" aria-label="Change content">
              <button id="files-tab" type="button" role="tab" aria-selected="true" aria-controls="files-panel">Files <span id="file-count"></span></button>
              <button id="diff-tab" type="button" role="tab" aria-selected="false" aria-controls="diff-panel">Diff</button>
            </div>

            <section id="files-panel" class="tab-panel" role="tabpanel" aria-labelledby="files-tab">
              <div class="panel-loading" id="files-loading">Loading files…</div>
              <div class="file-list" id="file-list"></div>
            </section>

            <section id="diff-panel" class="tab-panel diff-panel" role="tabpanel" aria-labelledby="diff-tab" hidden>
              <div class="panel-loading" id="diff-loading">Loading diff…</div>
              <div class="diff-view" id="diff-view"></div>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
